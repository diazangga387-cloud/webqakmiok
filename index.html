<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PT. Katsushiro Indonesia - Quality Assurance & Inspection Portal</title>
<style>
:root{--navy:#061b3a;--navy2:#0b2f63;--blue:#1267b1;--lime:#75F40C;--green:#16a46b;--yellow:#f4b400;--red:#d93b3b;--orange:#f27a16;--bg:#f4f7fb;--card:#fff;--text:#203047;--muted:#6f7e91;--line:#dfe7f0;--shadow:0 12px 30px rgba(7,35,70,.08);--radius:16px}
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:265px;background:linear-gradient(180deg,var(--navy),#092852);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand img{width:48px;height:48px;object-fit:cover;border-radius:12px;background:#fff}.brand b{font-size:14px;line-height:1.2}.brand span{display:block;font-size:10px;color:#a9bdd9;margin-top:4px}.nav-title{font-size:10px;color:#87a5ca;letter-spacing:1px;font-weight:700;margin:18px 9px 7px}.nav button{width:100%;border:0;background:transparent;color:#c8d7ea;text-align:left;padding:10px 11px;border-radius:10px;margin:2px 0;font-size:13px;display:flex;align-items:center;gap:9px}.nav button:hover,.nav button.active{background:rgba(117,244,12,.13);color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--lime)}.main{flex:1;min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--text);font-size:18px;display:block;margin-top:3px}.top-actions{display:flex;align-items:center;gap:9px}.role{background:#eef5ff;color:var(--blue);font-weight:700;border-radius:999px;padding:8px 12px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800}.content{padding:24px;max-width:1600px;margin:auto}.hero{background:linear-gradient(110deg,#071e42,#104c8d);color:#fff;border-radius:20px;padding:24px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:var(--shadow)}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#c7d9ef;font-size:13px}.hero img{width:96px;height:96px;border-radius:18px;background:#fff;object-fit:cover}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:28px;font-weight:800;margin:7px 0}.kpi .sub{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.2fr .8fr;margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.section-head h3{margin:0;font-size:15px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 12px;border-radius:9px;font-size:12px;font-weight:700}.btn.primary{background:var(--navy2);border-color:var(--navy2);color:#fff}.btn.lime{background:var(--lime);border-color:var(--lime);color:#08203d}.btn.danger{color:#fff;background:var(--red);border-color:var(--red)}.btn.small{padding:7px 9px;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:9px;margin-bottom:13px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,103,177,.1)}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.field.full{grid-column:1/-1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;white-space:nowrap}.table th{background:#f7f9fc;color:#63738a;font-size:10px;text-transform:uppercase;letter-spacing:.5px}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.badge.ok{background:#e5f7ef;color:#0b8a58}.badge.wait{background:#fff4d9;color:#9a6900}.badge.ng{background:#ffe7e7;color:#bb2525}.badge.info{background:#e8f2ff;color:#1766aa}.chartbox{height:250px;position:relative}.chartbox canvas{width:100%;height:100%;display:block}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.timeline{display:grid;gap:9px}.step{display:flex;gap:10px;align-items:flex-start}.dot{width:10px;height:10px;border-radius:50%;background:var(--lime);margin-top:4px;flex:none}.step b{font-size:12px}.step small{display:block;color:var(--muted);margin-top:2px}.modal{position:fixed;inset:0;background:rgba(3,18,38,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal.show{display:flex}.modal-card{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061b3a,#0e4b88)}.login-card{width:min(450px,92vw);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 60px rgba(0,0,0,.25)}.login-logo{width:86px;height:86px;display:block;margin:0 auto 15px;border-radius:18px}.login h1{text-align:center;font-size:22px;margin:0}.login p{text-align:center;color:var(--muted);font-size:12px}.demo-roles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:13px}.demo-roles button{padding:11px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;font-weight:700;color:var(--navy)}.print-only{display:none}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:50;font-size:12px}.toast.show{display:block}.mini-stat{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.mini-stat:last-child{border:0}.module-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:17px}.module-title h2{margin:0;font-size:23px}.module-title p{margin:5px 0 0;color:var(--muted);font-size:12px}.module-layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.sticky-card{align-self:start}.notice{padding:11px 12px;background:#f1f7ff;border:1px solid #d7e9ff;border-radius:10px;font-size:11px;color:#42607e;margin-bottom:12px}.progress{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lime);border-radius:99px}.mobile-menu{display:none}
@media(max-width:1050px){.sidebar{width:220px}.kpis{grid-template-columns:repeat(2,1fr)}.module-layout{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{display:none}.mobile-menu{display:block}.topbar{padding:0 15px}.content{padding:15px}.filters,.formgrid{grid-template-columns:1fr}.hero{padding:18px}.hero img{width:70px;height:70px}.kpis{grid-template-columns:1fr 1fr}.top-actions .role{display:none}}
@media print{.sidebar,.topbar,.no-print,.btn,.toolbar,.filters,.modal,.login{display:none!important}.main{width:100%}.content{padding:0}.card,.hero{box-shadow:none;border:1px solid #bbb}.print-only{display:block}.table{min-width:0}.table th,.table td{font-size:9px}.chartbox{height:220px}body{background:#fff}}
</style></head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<script>
const LOGO='logo.png';
const modules={
 E1:{group:'SUPPLIER QUALITY',title:'E.1 Checklist Subcont',desc:'Submission checklist supplier, review QA, status approval dan kesiapan Finance.',fields:[['supplier','Supplier','text'],['date','Tanggal Pengiriman','date'],['part','Part Number','text'],['qty','Quantity','number'],['status','Status','select','Menunggu Review|Disetujui QAI|Revisi'],['remark','Remark','textarea']],chart:{label:'Submission per supplier',type:'bar',key:'supplier'},columns:['No','Supplier','Tanggal','Part Number','Qty','Status','Remark'],sample:[['KMI Supplier A','2026-09-28','PC-1001',120,'Disetujui QAI','OK product'],['KMI Supplier B','2026-09-28','PC-1008',85,'Menunggu Review','-'],['KMI Supplier C','2026-09-29','PC-1012',140,'Revisi','File checklist kurang']]},
 E2:{group:'SUPPLIER QUALITY',title:'E.2 NG Performance',desc:'Dashboard performance NG supplier dengan filter periode, supplier dan tipe NG.',fields:[['supplier','Supplier','text'],['period','Bulan','month'],['part','Part Number','text'],['ng','NG Qty','number'],['delivery','Delivery Qty','number'],['ngtype','Type NG','text']],chart:{label:'NG rate per supplier (%)',type:'bar',key:'supplier',rate:true},columns:['No','Supplier','Bulan','Part Number','NG Qty','Delivery Qty','NG Rate','Type NG'],sample:[['Supplier A','2026-09','PC-1001',3,1200,'Scratch'],['Supplier B','2026-09','PC-1008',8,950,'Dimension'],['Supplier C','2026-09','PC-1012',2,1100,'Visual']]},
 E3:{group:'SUPPLIER QUALITY',title:'E.3 Pre / Hatsumono',desc:'Dokumen Pre/Hatsumono: foto produk, fasilitas, welder, inspector, review QA dan status trial.',fields:[['supplier','Supplier','text'],['doctype','Document Type','select','Pre|Hatsumono'],['part','Part Number','text'],['photoProduct','Foto Produk','file'],['photoFacility','Foto Fasilitas','file'],['welder','Informasi Welder','text'],['inspector','Informasi Inspector','text'],['status','Status','select','Submitted|Ready Trial|Revision|Approved']],chart:{label:'Dokumen berdasarkan status',type:'bar',key:'status'},columns:['No','Supplier','Type','Part','Welder','Inspector','Status'],sample:[['Supplier A','Hatsumono','PC-1001','W-01','Inspector 01','Ready Trial'],['Supplier B','Pre','PC-1008','W-04','Inspector 03','Submitted'],['Supplier C','Hatsumono','PC-1012','W-02','Inspector 02','Approved']]},
 E4:{group:'SUPPLIER QUALITY',title:'E.4 Submit PCC',desc:'Submit PCC supplier → review QA → Purchasing → Kintone. Status dan waktu tercatat.',fields:[['problemNo','Nomor Problem','text'],['problem','Nama Problem','text'],['supplier','Supplier','text'],['qty','Quantity','number'],['desc','Deskripsi','textarea'],['file','Upload PCC','file'],['status','Status','select','Submitted|QA Review|Approved|Revision|Closed']],chart:{label:'PCC berdasarkan status',type:'bar',key:'status'},columns:['No','Problem No','Problem','Supplier','Qty','Status','Deskripsi'],sample:[['PR-260901','Scratch','Supplier A',50,'Approved','PCC lengkap'],['PR-260902','Dimension','Supplier B',25,'QA Review','Menunggu analisa'],['PR-260903','Visual','Supplier C',15,'Closed','Sent to Kintone']]},
 I1:{group:'INSPECTION',title:'I.1 Checksheet Tablet',desc:'Input stamp/lot, part, process, operator dan actual parameter terhadap standard.',fields:[['stamp','Stamp / Lot','text'],['part','Part Number','text'],['process','Process','text'],['operator','Operator','text'],['actual','Actual Value','number'],['standard','Standard','text'],['status','Status','select','Valid|NG|Review']],chart:{label:'Checksheet status',type:'bar',key:'status'},columns:['No','Stamp/Lot','Part','Process','Operator','Actual','Standard','Status'],sample:[['ST-260929-01','PC-1001','Machining','OP-01',12.02,'12.00 ± 0.05','Valid'],['ST-260929-02','PC-1008','Welding','OP-02',9.80,'10.00 ± 0.10','Valid'],['ST-260929-03','PC-1012','Assembly','OP-03',10.20,'10.00 ± 0.10','NG']]},
 I2:{group:'INSPECTION',title:'I.2 Daily QA Report',desc:'Laporan harian QA: stamp, line, process, status, location, quantity, urgent dan photo.',fields:[['stamp','Stamp Number','text'],['line','Line','text'],['process','Process','text'],['status','Status','select','OK|NG|Urgent|Follow Up'],['location','Location','text'],['qty','Quantity','number'],['urgent','Urgent','select','No|Yes'],['photo','Photo','file']],chart:{label:'Daily report status',type:'bar',key:'status'},columns:['No','Stamp','Line','Process','Status','Location','Qty','Urgent'],sample:[['ST-01','LINE A','Machining','OK','Area 1',120,'No'],['ST-02','LINE B','Welding','NG','Area 2',45,'Yes'],['ST-03','LINE A','Assembly','Follow Up','Area 3',75,'No']]},
 I3:{group:'INSPECTION',title:'I.3 Request Inspection',desc:'Request inspection dari Produksi/PPIC/PE/Sales dengan prioritas, ETA dan keputusan Inspector.',fields:[['requester','Requester','text'],['type','Jenis Inspection','text'],['part','Product / Part','text'],['line','Line','text'],['qty','Quantity','number'],['priority','Priority','select','Normal|High|Urgent'],['eta','ETA','datetime-local'],['status','Status','select','Submitted|Approved|Rejected|Completed'],['photo','Photo','file']],chart:{label:'Request berdasarkan priority',type:'bar',key:'priority'},columns:['No','Requester','Type','Part','Line','Qty','Priority','ETA','Status'],sample:[['Produksi','First Piece','PC-1001','LINE A',20,'High','2026-09-29T10:30','Approved'],['PPIC','Incoming','PC-1008','LINE B',50,'Normal','2026-09-29T13:00','Submitted'],['PE','Process Audit','PC-1012','LINE C',10,'Urgent','2026-09-29T09:45','Completed']]},
 I4:{group:'INSPECTION',title:'I.4 Queue Monitoring',desc:'Monitoring antrian real-time: queue, request time, product, requester, priority, inspector dan ETA.',fields:[['requester','Requester','text'],['product','Product / Part','text'],['priority','Priority','select','Normal|High|Urgent'],['status','Status','select','Waiting|In Progress|Completed'],['inspector','Inspector','text'],['eta','ETA','datetime-local']],chart:{label:'Queue berdasarkan status',type:'bar',key:'status'},columns:['Queue','Requester','Product','Priority','Status','Inspector','ETA'],sample:[['Q-001','Produksi','PC-1001','High','In Progress','Inspector 01','10:30'],['Q-002','PPIC','PC-1008','Normal','Waiting','Inspector 02','13:00'],['Q-003','PE','PC-1012','Urgent','Completed','Inspector 03','09:45']]}
};
const roles={ADMIN:Object.keys(modules),INSPECTION:['E2','E3','E4','I1','I2','I3','I4'],STAFF:['E1','E2','E3','E4','I1','I2','I3','I4'],SUPPLIER:['E1','E2','E3','E4','I4']};
let state={role:null,module:'DASH',data:{},edit:null};
Object.keys(modules).forEach(k=>state.data[k]=load(k)||modules[k].sample.map((r,i)=>({id:Date.now()+i,values:r}))); 
function load(k){try{return JSON.parse(localStorage.getItem('qai_'+k))}catch(e){return null}}
function save(k){localStorage.setItem('qai_'+k,JSON.stringify(state.data[k]))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function login(role){state.role=role;state.module='DASH';render()}
function logout(){state.role=null;render()}
function nav(id){state.module=id;render()}
function visibleModules(){return roles[state.role]||[]}
function statusBadge(v){let c=['Approved','Disetujui QAI','Valid','Completed','Closed','Ready Trial','OK'].includes(v)?'ok':['Revision','Revisi','Rejected','NG'].includes(v)?'ng':['Waiting','Menunggu Review','Submitted','QA Review','In Progress','Follow Up','Review'].includes(v)?'wait':'info';return '<span class="badge '+c+'">'+esc(v)+'</span>'}
function render(){document.getElementById('root').innerHTML=state.role?appHTML():loginHTML()}
function loginHTML(){return `<div class="login"><div class="login-card"><img class="login-logo" src="${LOGO}"><h1>QA & Inspection Portal</h1><p>PT. KATSUSHIRO INDONESIA • Integrated Quality Digital System</p><div class="field"><label>Role</label><select id="loginRole"><option>ADMIN</option><option>INSPECTION</option><option>STAFF</option><option>SUPPLIER</option></select></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="login(document.getElementById('loginRole').value)">Login</button><p style="margin-top:15px">Demo cepat</p><div class="demo-roles">${['ADMIN','INSPECTION','STAFF','SUPPLIER'].map(r=>`<button onclick="login('${r}')">${r}</button>`).join('')}</div></div></div>`}
function sidebar(){return `<aside class="sidebar"><div class="brand"><img src="${LOGO}"><div><b>QUALITY ASSURANCE<br>AND INSPECTION</b><span>PT. KATSUSHIRO INDONESIA</span></div></div><div class="nav"><div class="nav-title">MAIN</div><button class="${state.module==='DASH'?'active':''}" onclick="nav('DASH')">⌂ Dashboard</button><div class="nav-title">SUPPLIER QUALITY</div>${visibleModules().filter(k=>k[0]==='E').map(k=>`<button class="${state.module===k?'active':''}" onclick="nav('${k}')">▣ ${k} • ${modules[k].title.split(' ').slice(1).join(' ')}</button>`).join('')}<div class="nav-title">INSPECTION</div>${visibleModules().filter(k=>k[0]==='I').map(k=>`<button class="${state.module===k?'active':''}" onclick="nav('${k}')">◈ ${k} • ${modules[k].title.split(' ').slice(1).join(' ')}</button>`).join('')}<div class="nav-title">SYSTEM</div><button onclick="exportAll()">⇩ Export All CSV</button><button onclick="printCurrent()">▤ Print</button><button onclick="logout()">↪ Logout</button></div></aside>`}
function appHTML(){return `<div class="app">${sidebar()}<main class="main"><header class="topbar"><div class="crumb"><span>PT. KATSUSHIRO INDONESIA • Integrated Digital QA</span><strong>${state.module==='DASH'?'Dashboard':modules[state.module].title}</strong></div><div class="top-actions"><span class="role">${state.role}</span><span class="avatar">${state.role[0]}</span></div></header><section class="content" id="content">${state.module==='DASH'?dashboardHTML():moduleHTML(state.module)}</section>${state.edit?editModalHTML(state.edit.k,state.edit.id):''}</main></div>`}
function dashboardHTML(){let total=Object.values(state.data).reduce((a,x)=>a+x.length,0);let urgent=state.data.I3.filter(x=>x.values[5]==='Urgent').length;let ng=state.data.E2.reduce((a,x)=>a+Number(x.values[3]||0),0);return `<div class="hero"><div><h1>Integrated Quality Assurance & Inspection</h1><p>Alur terintegrasi: REQUEST → VALIDATE → PRIORITIZE → QUEUE → INSPECT → UPDATE → DASHBOARD → ANALYZE</p></div><img src="${LOGO}"></div><div class="grid kpis"><div class="card kpi"><div class="label">Total Transaction</div><div class="value">${total}</div><div class="sub">E1–E4 & I1–I4</div></div><div class="card kpi"><div class="label">NG Quantity</div><div class="value">${ng}</div><div class="sub">from E.2 records</div></div><div class="card kpi"><div class="label">Urgent Request</div><div class="value">${urgent}</div><div class="sub">I.3 priority</div></div><div class="card kpi"><div class="label">Queue Waiting</div><div class="value">${state.data.I4.filter(x=>x.values[3]==='Waiting').length}</div><div class="sub">I.4 monitoring</div></div></div><div class="grid two"><div class="card"><div class="section-head"><h3>Module Activity</h3><button class="btn small" onclick="printCurrent()">Print Dashboard</button></div><div class="chartbox"><canvas id="dashChart"></canvas></div></div><div class="card"><div class="section-head"><h3>Integrated Workflow</h3></div><div class="timeline"><div class="step"><i class="dot"></i><div><b>E1–E4 Supplier Quality</b><small>Checklist, performance, Pre/Hatsumono, PCC</small></div></div><div class="step"><i class="dot"></i><div><b>I1–I4 Inspection</b><small>Checksheet, daily report, request, queue</small></div></div><div class="step"><i class="dot"></i><div><b>Database & Dashboard</b><small>Data entry → validation → reporting → analysis</small></div></div><div class="step"><i class="dot"></i><div><b>Follow-up</b><small>QA, Purchasing, Supplier dan next process</small></div></div></div></div></div>`}
function moduleHTML(k){const m=modules[k], rows=state.data[k];return `<div class="module-title"><div><h2>${m.title}</h2><p>${m.desc}</p></div><div class="toolbar no-print"><button class="btn" onclick="printCurrent()">▤ Print</button><button class="btn" onclick="exportModule('${k}')">⇩ CSV</button></div></div><div class="module-layout"><div class="card sticky-card no-print"><div class="section-head"><h3>Input Data</h3><span class="badge info">${state.role}</span></div><div class="notice">Data baru dan perubahan data tersimpan otomatis di browser. Gunakan Edit untuk memperbarui, Print untuk mencetak, dan CSV untuk backup data.</div><form onsubmit="addRecord(event,'${k}')"><div class="formgrid">${m.fields.map(f=>fieldHTML(f)).join('')}</div><button class="btn lime" style="width:100%;margin-top:13px">＋ Simpan Data</button></form></div><div class="grid" style="gap:16px"><div class="card"><div class="section-head"><div><h3>${m.chart.label}</h3><div style="font-size:10px;color:var(--muted);margin-top:3px">Grafik otomatis dari data input ${k}</div></div><button class="btn small no-print" onclick="refreshChart('${k}')">↻ Refresh</button></div><div class="chartbox"><canvas id="chart-${k}"></canvas></div></div><div class="card"><div class="section-head"><h3>Data ${k}</h3><span class="badge info">${rows.length} record</span></div><div class="table-wrap"><table class="table"><thead><tr>${m.columns.map(c=>`<th>${c}</th>`).join('')}<th class="no-print">Action</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>rowHTML(k,r,i)).join(''):`<tr><td colspan="${m.columns.length+1}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div></div></div></div>`}
function fieldHTML(f){const [key,label,type,opts]=f;if(type==='textarea')return `<div class="field full"><label>${label}</label><textarea name="${key}" rows="3" placeholder="Input ${label}"></textarea></div>`;if(type==='select')return `<div class="field"><label>${label}</label><select name="${key}">${opts.split('|').map(o=>`<option>${o}</option>`).join('')}</select></div>`;if(type==='file')return `<div class="field"><label>${label}</label><input type="file" name="${key}" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls"></div>`;return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} required></div>`}
function addRecord(e,k){e.preventDefault();const fd=new FormData(e.target),m=modules[k],vals=m.fields.map(f=>{const v=fd.get(f[0]);return f[2]==='file'?(v&&v.name?v.name:'-'):v});state.data[k].unshift({id:Date.now(),values:vals});save(k);toast('Data '+k+' berhasil disimpan');render();setTimeout(()=>refreshChart(k),50)}
function rowHTML(k,r,i){let v=r.values;let cells;if(k==='E1')cells=[i+1,v[0],v[1],v[2],v[3],statusBadge(v[4]),esc(v[5])];if(k==='E2'){let rate=(Number(v[3]||0)/Math.max(1,Number(v[4]||0))*100).toFixed(2);cells=[i+1,v[0],v[1],v[2],v[3],v[4],rate+'%',esc(v[5])]}if(k==='E3')cells=[i+1,v[0],v[1],v[2],esc(v[5]),esc(v[6]),statusBadge(v[7])];if(k==='E4')cells=[i+1,esc(v[0]),esc(v[1]),esc(v[2]),v[3],statusBadge(v[5]),esc(v[4])];if(k==='I1')cells=[i+1,...v.slice(0,5).map(esc),esc(v[5]),statusBadge(v[6])];if(k==='I2')cells=[i+1,...v.slice(0,6).map(esc),statusBadge(v[3]),esc(v[6])];if(k==='I3')cells=[i+1,...v.slice(0,6).map(esc),esc(v[6]),statusBadge(v[7])];if(k==='I4')cells=[esc('Q-'+String(i+1).padStart(3,'0')),...v.map(esc)];return `<tr>${cells.map(x=>`<td>${x}</td>`).join('')}<td class="no-print"><div class="toolbar"><button class="btn small" onclick="editRecord('${k}',${r.id})">Edit</button><button class="btn small" onclick="printRecord('${k}',${r.id})">Print</button><button class="btn small danger" onclick="deleteRecord('${k}',${r.id})">Hapus</button></div></td></tr>`}
function editModalHTML(k,id){const m=modules[k],r=state.data[k].find(x=>x.id===id);if(!r)return '';return `<div class="modal show" onclick="if(event.target===this)closeEdit()"><div class="modal-card"><div class="section-head"><div><h3>Edit Data ${k}</h3><div style="font-size:10px;color:var(--muted);margin-top:3px">Perubahan akan langsung disimpan ke browser.</div></div><button type="button" class="btn" onclick="closeEdit()">✕ Tutup</button></div><form onsubmit="updateRecord(event,'${k}',${id})"><div class="formgrid">${m.fields.map((f,i)=>editFieldHTML(f,r.values[i])).join('')}</div><div class="toolbar" style="justify-content:flex-end;margin-top:15px"><button type="button" class="btn" onclick="closeEdit()">Batal</button><button class="btn lime">✓ Simpan Perubahan</button></div></form></div></div>`}
function editFieldHTML(f,value){const [key,label,type,opts]=f;const val=escAttr(value??'');if(type==='textarea')return `<div class="field full"><label>${label}</label><textarea name="${key}" rows="3">${esc(value??'')}</textarea></div>`;if(type==='select')return `<div class="field"><label>${label}</label><select name="${key}">${opts.split('|').map(o=>`<option ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;if(type==='file')return `<div class="field"><label>${label}</label><input type="file" name="${key}" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls"><small style="display:block;color:var(--muted);margin-top:5px">File saat ini: ${esc(value||'-')} (kosongkan jika tidak diganti)</small></div>`;return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${val}" ${type==='number'?'min="0" step="any"':''} required></div>`}
function updateRecord(e,k,id){e.preventDefault();const fd=new FormData(e.target),m=modules[k],r=state.data[k].find(x=>x.id===id);if(!r)return;const vals=m.fields.map((f,i)=>{const v=fd.get(f[0]);if(f[2]==='file')return v&&v.name?v.name:r.values[i]||'-';return v});r.values=vals;save(k);state.edit=null;render();setTimeout(()=>refreshChart(k),50);toast('Data '+k+' berhasil diperbarui dan disimpan')}
function editRecord(k,id){state.edit={k,id};render()}
function closeEdit(){state.edit=null;render()}
function escAttr(v){return esc(v).replace(/`/g,'&#96;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function printRecord(k,id){const m=modules[k],r=state.data[k].find(x=>x.id===id);if(!r)return;const vals=r.values.map((v,i)=>m.fields[i]&&m.fields[i][2]==='file'?v:v);const rows=m.fields.map((f,i)=>`<tr><th>${esc(f[1])}</th><td>${esc(vals[i]??'-')}</td></tr>`).join('');const w=window.open('','_blank','width=900,height=700');if(!w){toast('Popup print diblokir browser');return}w.document.write(`<!doctype html><html><head><title>${esc(m.title)} - Print</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#203047}h1{font-size:22px;margin:0 0 4px}p{color:#6f7e91;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #dfe7f0;padding:10px;text-align:left;font-size:12px}th{width:32%;background:#f5f8fb}footer{margin-top:30px;font-size:10px;color:#6f7e91}</style></head><body><h1>PT. KATSUSHIRO INDONESIA</h1><p>${esc(m.title)} • Data Record</p><table>${rows}</table><footer>Printed from Integrated QA & Inspection Portal</footer><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function deleteRecord(k,id){if(!confirm('Hapus data ini?'))return;state.data[k]=state.data[k].filter(x=>x.id!==id);save(k);render();setTimeout(()=>refreshChart(k),50);toast('Data dihapus')}
function getChartData(k){const m=modules[k], rows=state.data[k];let map={};rows.forEach(r=>{let val;if(m.chart.rate){val=Number(r.values[3]||0)/Math.max(1,Number(r.values[4]||0))*100}else{let idx=m.fields.findIndex(f=>f[0]===m.chart.key);val=r.values[idx]||'-'};if(m.chart.rate)map[valKey(r.values[0])]=(map[valKey(r.values[0])]||[]); if(!m.chart.rate)map[valKey(val)]=(map[valKey(val)]||0)+1;});if(m.chart.rate){let grouped={};rows.forEach(r=>{let s=valKey(r.values[0]);if(!grouped[s])grouped[s]=[0,0];grouped[s][0]+=Number(r.values[3]||0);grouped[s][1]+=Number(r.values[4]||0)});return Object.entries(grouped).map(([label,a])=>({label,value:a[1]?a[0]/a[1]*100:0}))}return Object.entries(map).map(([label,value])=>({label,value})).slice(0,12)}
function valKey(v){return String(v||'-').trim()||'-'}
function drawBar(canvas,data,title){if(!canvas)return;const dpr=window.devicePixelRatio||1,w=canvas.clientWidth||600,h=canvas.clientHeight||250;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);const pad={l:42,r:16,t:18,b:48},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(1,...data.map(x=>x.value));c.strokeStyle='#dfe7f0';c.fillStyle='#6f7e91';c.font='10px Segoe UI,Arial';for(let i=0;i<=4;i++){let y=pad.t+ch*i/4;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();let val=max*(1-i/4);c.fillText(val.toFixed(max<10?1:0),5,y+3)}let bw=Math.max(18,(cw/data.length)*.55);data.forEach((x,i)=>{let x0=pad.l+(i+.5)*cw/data.length-bw/2;let bh=x.value/max*ch;c.fillStyle=i%2?'#1267b1':'#75c90b';c.fillRect(x0,pad.t+ch-bh,bw,bh);c.fillStyle='#203047';c.save();c.translate(x0+bw/2,pad.t+ch+14);c.rotate(-.28);c.textAlign='center';let lab=String(x.label).slice(0,18);c.fillText(lab,0,0);c.restore();c.fillStyle='#203047';c.textAlign='center';c.fillText(x.value.toFixed(x.value<10?1:0),x0+bw/2,pad.t+ch-bh-5);c.textAlign='left'})}
function drawDashboard(){let c=document.getElementById('dashChart');if(!c)return;let data=Object.keys(modules).map(k=>({label:k,value:state.data[k].length}));drawBar(c,data,'Activity')}
function refreshChart(k){drawBar(document.getElementById('chart-'+k),getChartData(k),modules[k].chart.label)}
function exportModule(k){const m=modules[k],head=m.columns,lines=[head.join(',')];state.data[k].forEach((r,i)=>{let cells=r.values.slice();if(k==='E2')cells.push((Number(r.values[3]||0)/Math.max(1,Number(r.values[4]||0))*100).toFixed(2)+'%');if(k==='I4')cells.unshift('Q-'+String(i+1).padStart(3,'0'));lines.push([i+1,...cells].map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(','))});downloadBlob(lines.join('\n'),'QAI_'+k+'_data.csv','text/csv')}
function exportAll(){Object.keys(modules).forEach((k,i)=>setTimeout(()=>exportModule(k),i*250));toast('Export CSV seluruh modul dimulai')}
function downloadBlob(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function printCurrent(){window.print()}
window.addEventListener('resize',()=>{if(state.role){if(state.module==='DASH')drawDashboard();else refreshChart(state.module)}});
render();setTimeout(()=>{if(state.role){if(state.module==='DASH')drawDashboard();else refreshChart(state.module)}},80);
</script>
</body></html>
